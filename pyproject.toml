[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esci-l2-bench"
version = "0.1.0"
description = "L2 rerankers for product search on Amazon ESCI: cross-encoder vs decision models on frozen ANN lists"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.51", "sentence-transformers>=3.0", "faiss-cpu>=1.8", "tqdm"]
api = ["certifi"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
